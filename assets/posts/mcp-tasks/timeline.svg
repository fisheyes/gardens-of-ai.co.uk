<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica Neue,sans-serif">
  <rect width="900" height="400" rx="18" fill="#fbf9f4"/>
  <defs>
    <linearGradient id="wait" x1="0" x2="1"><stop offset="0" stop-color="#f2d9c8"/><stop offset="1" stop-color="#e9c4ab"/></linearGradient>
    <linearGradient id="job" x1="0" x2="1"><stop offset="0" stop-color="#dfe8d6"/><stop offset="1" stop-color="#cddcc0"/></linearGradient>
  </defs>
  <text x="40" y="44" font-size="15" font-weight="700" fill="#33372f">Before: the agent waits</text>
  <text x="40" y="64" font-size="12" fill="#6f7569">One tool call, held open for the whole job</text>
  <text x="40" y="113" font-size="12" fill="#6f7569">Agent</text>
  <rect x="120" y="94" width="60" height="28" rx="14" fill="#5f7d5a" stroke="#33372f" stroke-width="2.5"/>
  <text x="150" y="113" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">call</text>
  <rect x="186" y="94" width="520" height="28" rx="14" fill="url(#wait)" stroke="#33372f" stroke-width="2.5"/>
  <text x="446" y="113" font-size="12.5" fill="#33372f" text-anchor="middle">waiting … waiting … waiting …</text>
  <rect x="712" y="94" width="140" height="28" rx="14" fill="#5f7d5a" stroke="#33372f" stroke-width="2.5"/>
  <text x="782" y="113" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">explains Lambda</text>
  <text x="40" y="159" font-size="12" fill="#6f7569">Server</text>
  <rect x="186" y="140" width="520" height="28" rx="14" fill="url(#job)" stroke="#33372f" stroke-width="2.5"/>
  <text x="446" y="159" font-size="12.5" fill="#33372f" text-anchor="middle">slow job, 30 seconds</text>

  <line x1="40" y1="200" x2="860" y2="200" stroke="#e7e3d8" stroke-width="2" stroke-dasharray="4 6"/>

  <text x="40" y="236" font-size="15" font-weight="700" fill="#33372f">After: the agent works while it waits</text>
  <text x="40" y="256" font-size="12" fill="#6f7569">Start, do other work, check the task</text>
  <text x="40" y="305" font-size="12" fill="#6f7569">Agent</text>
  <rect x="120" y="286" width="60" height="28" rx="14" fill="#5f7d5a" stroke="#33372f" stroke-width="2.5"/>
  <text x="150" y="305" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">start</text>
  <rect x="186" y="286" width="300" height="28" rx="14" fill="#b9cca8" stroke="#33372f" stroke-width="2.5"/>
  <text x="336" y="305" font-size="12.5" fill="#33372f" text-anchor="middle">explains Lambda</text>
  <rect x="492" y="286" width="60" height="28" rx="14" fill="#c0764f" stroke="#33372f" stroke-width="2.5"/>
  <text x="522" y="305" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">check</text>
  <rect x="558" y="286" width="142" height="28" rx="14" fill="#b9cca8" stroke="#33372f" stroke-width="2.5"/>
  <text x="629" y="305" font-size="12.5" fill="#33372f" text-anchor="middle">more useful work</text>
  <rect x="706" y="286" width="60" height="28" rx="14" fill="#c0764f" stroke="#33372f" stroke-width="2.5"/>
  <text x="736" y="305" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">check</text>
  <text x="776" y="305" font-size="12.5" fill="#33372f" font-weight="600">result ✓</text>
  <text x="40" y="351" font-size="12" fill="#6f7569">Server</text>
  <rect x="186" y="332" width="520" height="28" rx="14" fill="url(#job)" stroke="#33372f" stroke-width="2.5"/>
  <text x="446" y="351" font-size="12.5" fill="#33372f" text-anchor="middle">slow job, 30 seconds</text>
  <text x="522" y="278" font-size="11" fill="#6f7569" text-anchor="middle">"still working"</text>
  <text x="446" y="384" font-size="11.5" fill="#6f7569" text-anchor="middle">time →</text>
</svg>
