<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica Neue,sans-serif">
  <rect width="900" height="420" rx="18" fill="#fbf9f4"/>
  <ellipse cx="380" cy="350" rx="250" ry="22" fill="#e7e3d8"/>
  <!-- antenna -->
  <rect x="566" y="96" width="22" height="30" rx="4" fill="#c9a24a" stroke="#33372f" stroke-width="2"/>
  <rect x="569" y="20" width="16" height="80" rx="8" fill="#33372f"/>
  <rect x="571" y="0" width="12" height="40" rx="6" fill="#33372f" transform="rotate(0)"/>
  <!-- printed case -->
  <rect x="150" y="120" width="460" height="220" rx="34" fill="#b9cca8" stroke="#33372f" stroke-width="3"/>
  <g stroke="#a4ba93" stroke-width="1"></g>
  <rect x="170" y="138" width="420" height="184" rx="24" fill="#c6d6b6"/>
  <!-- board window -->
  <rect x="200" y="160" width="300" height="140" rx="10" fill="#1f2a3a" stroke="#33372f" stroke-width="2"/>
  <!-- OLED -->
  <rect x="226" y="178" width="200" height="104" rx="6" fill="#0d1218" stroke="#3a4656"/>
  <text x="240" y="208" font-size="16" fill="#9fd7ff" font-family="ui-monospace,Menlo,monospace">Meshtastic</text>
  <text x="240" y="232" font-size="12" fill="#9fd7ff" font-family="ui-monospace,Menlo,monospace">EU_868  LongFast</text>
  <text x="240" y="252" font-size="12" fill="#9fd7ff" font-family="ui-monospace,Menlo,monospace">batt 87%  ch util 2%</text>
  <rect x="240" y="262" width="120" height="6" rx="3" fill="#2b4a5e"/><rect x="240" y="262" width="96" height="6" rx="3" fill="#9fd7ff"/>
  <!-- buttons + LED -->
  <circle cx="460" cy="196" r="10" fill="#e9e5da" stroke="#33372f" stroke-width="2"/>
  <circle cx="460" cy="236" r="10" fill="#e9e5da" stroke="#33372f" stroke-width="2"/>
  <circle cx="460" cy="270" r="4" fill="#c0764f"/>
  <!-- USB-C -->
  <rect x="140" y="214" width="16" height="36" rx="6" fill="#8a8f86" stroke="#33372f" stroke-width="2"/>
  <!-- battery peeking -->
  <rect x="520" y="166" width="60" height="128" rx="10" fill="#f2d9c8" stroke="#33372f" stroke-width="2"/>
  <text x="550" y="236" font-size="12" fill="#8b5a3e" text-anchor="middle" transform="rotate(-90 550 232)">Li-ion</text>
  <!-- labels -->
  <g font-size="13" fill="#33372f">
    <line x1="430" y1="200" x2="660" y2="190" stroke="#c0764f" stroke-width="1.5"/><text x="668" y="186" font-weight="600">0.96" OLED screen</text>
    <line x1="585" y1="60" x2="660" y2="60" stroke="#c0764f" stroke-width="1.5"/><text x="668" y="56" font-weight="600">868 MHz antenna</text><text x="668" y="74" fill="#6f7569" font-size="12">SMA connector</text>
    <line x1="580" y1="250" x2="660" y2="260" stroke="#c0764f" stroke-width="1.5"/><text x="668" y="256" font-weight="600">Battery</text><text x="668" y="274" fill="#6f7569" font-size="12">inside the case</text>
    <line x1="148" y1="232" x2="90" y2="232" stroke="#c0764f" stroke-width="1.5"/><text x="30" y="220" font-weight="600">USB-C</text><text x="30" y="236" fill="#6f7569" font-size="12">charging</text>
    <line x1="300" y1="320" x2="300" y2="376" stroke="#c0764f" stroke-width="1.5"/><text x="300" y="396" font-weight="600" text-anchor="middle">3D printed case</text>
  </g>
  <g transform="translate(668 312)">
    <rect width="190" height="74" rx="14" fill="#fff" stroke="#e7e3d8"/>
    <text x="16" y="28" font-size="12" fill="#6f7569">Heltec V3, per radio</text>
    <text x="16" y="58" font-size="26" font-weight="700" fill="#c0764f">≈ £18</text>
  </g>
</svg>
