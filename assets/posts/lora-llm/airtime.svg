<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica Neue,sans-serif">
  <rect width="900" height="330" rx="18" fill="#fbf9f4"/>
  <text x="40" y="48" font-size="18" font-weight="700" fill="#33372f">The UK rule: 6 minutes of transmit time per hour</text>
  <text x="40" y="72" font-size="13" fill="#6f7569">10% duty cycle on 869.4–869.65 MHz. One 149-word answer about bees, estimated airtime (LongFast).</text>
  <!-- budget bar: 360 s = 760 px -->
  <text x="40" y="112" font-size="13" fill="#6f7569">One hour budget, 360 s</text>
  <rect x="40" y="122" width="820" height="18" rx="9" fill="#eef3e8"/>
  <rect x="40" y="122" width="21" height="18" rx="4" fill="#a6ad9f"/>
  <rect x="63" y="122" width="5" height="18" rx="2" fill="#c0764f"/>
  <g font-size="14">
    <text x="40" y="186" fill="#33372f">Plain text</text>
    <rect x="200" y="170" width="460" height="24" rx="4" fill="#a6ad9f"/>
    <text x="670" y="187" fill="#33372f" font-weight="600">≈ 9.0 s · 6 messages</text>
    <text x="40" y="232" fill="#33372f" font-weight="700">Compressed</text>
    <rect x="200" y="216" width="107" height="24" rx="4" fill="#c0764f"/>
    <text x="317" y="233" fill="#33372f" font-weight="700">≈ 2.1 s · 2 messages</text>
  </g>
  <rect x="40" y="262" width="820" height="46" rx="12" fill="#fff" stroke="#e7e3d8"/>
  <text x="60" y="291" font-size="14" fill="#33372f">Answers like this per hour, before retries and ACKs:  <tspan font-weight="700">about 40</tspan> as plain text,  <tspan font-weight="700" fill="#c0764f">about 170</tspan> compressed.</text>
</svg>
