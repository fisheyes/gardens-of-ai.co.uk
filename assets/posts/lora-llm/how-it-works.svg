<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica Neue,sans-serif">
  <rect width="900" height="360" rx="18" fill="#fbf9f4"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3e8"/><stop offset="1" stop-color="#fbf9f4"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cddcc0"/><stop offset="1" stop-color="#e6eddc"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="250" rx="18" fill="url(#sky)"/>
  <!-- hills -->
  <path d="M0 270 C120 170 230 170 330 240 C420 300 520 200 640 220 C740 236 820 200 900 230 V360 H0Z" fill="url(#hill)"/>
  <path d="M0 300 C160 250 300 300 450 280 C600 260 760 300 900 280 V360 H0Z" fill="#dfe8d6"/>
  <!-- the walker's end: phone + field radio -->
  <g transform="translate(70 150)">
    <rect x="0" y="0" width="44" height="80" rx="9" fill="#fff" stroke="#33372f" stroke-width="2.5"/>
    <rect x="6" y="10" width="32" height="54" rx="3" fill="#eef3e8"/>
    <rect x="10" y="18" width="20" height="6" rx="3" fill="#5f7d5a"/><rect x="14" y="30" width="20" height="6" rx="3" fill="#c0764f"/><rect x="10" y="42" width="16" height="6" rx="3" fill="#5f7d5a"/>
    <rect x="62" y="28" width="40" height="52" rx="8" fill="#b9cca8" stroke="#33372f" stroke-width="2.5"/>
    <rect x="70" y="36" width="24" height="14" rx="2" fill="#33372f"/>
    <line x1="94" y1="28" x2="100" y2="-14" stroke="#33372f" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 40 q8 -6 14 0" stroke="#5f7d5a" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
  </g>
  <text x="70" y="262" font-size="14" font-weight="600" fill="#33372f">On the hill</text>
  <text x="70" y="280" font-size="12" fill="#6f7569">Phone + field radio, Bluetooth</text>
  <!-- radio waves -->
  <path d="M180 130 C330 30 520 30 640 120" fill="none" stroke="#c0764f" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g fill="none" stroke="#c0764f" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M176 120 a14 14 0 0 1 14 -10"/><path d="M172 114 a24 24 0 0 1 22 -18"/>
    <path d="M650 110 a14 14 0 0 0 -14 -10"/><path d="M656 104 a24 24 0 0 0 -22 -18"/>
  </g>
  <rect x="330" y="40" width="190" height="44" rx="22" fill="#fff" stroke="#e7e3d8"/>
  <text x="425" y="59" font-size="13" font-weight="600" fill="#33372f" text-anchor="middle">LoRa, kilometres, no signal</text>
  <text x="425" y="75" font-size="11.5" fill="#6f7569" text-anchor="middle">about 200 bytes per message</text>
  <!-- house with loft radio -->
  <g transform="translate(610 120)">
    <path d="M0 60 L60 10 L120 60 V140 H0Z" fill="#fff" stroke="#33372f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="48" y="32" width="24" height="22" rx="4" fill="#b9cca8" stroke="#33372f" stroke-width="2"/>
    <line x1="66" y1="32" x2="70" y2="10" stroke="#33372f" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="18" y="86" width="40" height="40" rx="5" fill="#eef3e8" stroke="#33372f" stroke-width="2"/>
    <line x1="24" y1="98" x2="52" y2="98" stroke="#5f7d5a" stroke-width="2"/><line x1="24" y1="108" x2="52" y2="108" stroke="#5f7d5a" stroke-width="2"/>
    <circle cx="48" cy="117" r="3" fill="#c0764f"/>
    <rect x="72" y="96" width="30" height="44" rx="2" fill="#f2d9c8" stroke="#33372f" stroke-width="2"/>
  </g>
  <text x="610" y="282" font-size="14" font-weight="600" fill="#33372f">Base camp</text>
  <text x="610" y="300" font-size="12" fill="#6f7569">Loft radio on Wi-Fi + home server</text>
  <!-- cloud -->
  <path d="M790 92 a22 22 0 0 1 40 -14 a18 18 0 0 1 32 14 a16 16 0 0 1 -4 32 h-66 a16 16 0 0 1 -2 -32z" fill="#fff" stroke="#33372f" stroke-width="2.5"/>
  <text x="826" y="114" font-size="12" font-weight="700" fill="#c0764f" text-anchor="middle">LLM</text>
  <path d="M744 160 C770 150 790 140 806 128" fill="none" stroke="#5f7d5a" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="812" y="150" font-size="11.5" fill="#6f7569">internet</text>
  
  <!-- steps -->
  <g font-size="12" fill="#33372f">
    <circle cx="300" cy="120" r="11" fill="#c0764f"/><text x="300" y="124" fill="#fff" font-weight="700" text-anchor="middle">1</text>
    <text x="316" y="124">question, compressed</text>
    <circle cx="752" cy="210" r="11" fill="#5f7d5a"/><text x="752" y="214" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="768" y="208">LLM answers,</text><text x="768" y="224">can search the web</text>
    <circle cx="520" cy="120" r="11" fill="#c0764f"/><text x="520" y="124" fill="#fff" font-weight="700" text-anchor="middle">3</text>
    <text x="536" y="124">answer, 1–4 messages</text>
  </g>
</svg>
