<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica Neue,sans-serif">
  <rect width="900" height="470" rx="18" fill="#fbf9f4"/>
  <text x="40" y="48" font-size="18" font-weight="700" fill="#33372f">Send the guess number, not the word</text>
  <text x="40" y="72" font-size="13" fill="#6f7569">Both ends run the same model, so both make the same list of guesses. (Illustration: real lists hold 49,152 tokens.)</text>
  <text x="40" y="128" font-size="13" fill="#6f7569" letter-spacing="1">THE MESSAGE SO FAR</text>
  <rect x="40" y="140" width="360" height="56" rx="12" fill="#fff" stroke="#e7e3d8"/>
  <text x="58" y="174" font-size="18" fill="#33372f">After the walk I went back to my <tspan fill="#c0764f" font-weight="700">house</tspan></text>
  <text x="40" y="236" font-size="13" fill="#6f7569" letter-spacing="1">WHAT IS SENT</text>
  <g transform="translate(40 250)">
    <rect width="168" height="78" rx="12" fill="#eef3e8"/>
    <text x="16" y="28" font-size="12" fill="#6f7569">the word "house"</text>
    <text x="16" y="60" font-size="22" font-weight="700" fill="#a6ad9f" text-decoration="line-through">5 bytes</text>
    <rect x="186" width="174" height="78" rx="12" fill="#fbefe7" stroke="#f0d4c3"/>
    <text x="202" y="28" font-size="12" fill="#8b5a3e">guess number 7</text>
    <text x="202" y="60" font-size="22" font-weight="700" fill="#c0764f">≈ 4 bits</text>
  </g>
  <text x="40" y="372" font-size="13" fill="#33372f">A common word near the top of the list costs a few bits.</text>
  <text x="40" y="392" font-size="13" fill="#33372f">An unusual word costs more. Most words are common.</text>
  <path d="M372 186 C400 260 420 330 448 330" fill="none" stroke="#c0764f" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="470" y="122" font-size="13" fill="#6f7569" letter-spacing="1" text-anchor="end">#</text>
  <text x="484" y="122" font-size="13" fill="#6f7569" letter-spacing="1">THE MODEL'S NEXT-WORD GUESSES</text>
<text x="470" y="149" font-size="13" fill="#6f7569" text-anchor="end">1</text><text x="484" y="149" font-size="15" font-weight="400" fill="#33372f">car</text><rect x="580" y="137" width="132" height="14" rx="4" fill="#cddcc0"/><text x="720" y="149" font-size="12" fill="#6f7569">22%</text>
<text x="470" y="179" font-size="13" fill="#6f7569" text-anchor="end">2</text><text x="484" y="179" font-size="15" font-weight="400" fill="#33372f">room</text><rect x="580" y="167" width="84" height="14" rx="4" fill="#cddcc0"/><text x="672" y="179" font-size="12" fill="#6f7569">14%</text>
<text x="470" y="209" font-size="13" fill="#6f7569" text-anchor="end">3</text><text x="484" y="209" font-size="15" font-weight="400" fill="#33372f">tent</text><rect x="580" y="197" width="66" height="14" rx="4" fill="#cddcc0"/><text x="654" y="209" font-size="12" fill="#6f7569">11%</text>
<text x="470" y="239" font-size="13" fill="#6f7569" text-anchor="end">4</text><text x="484" y="239" font-size="15" font-weight="400" fill="#33372f">flat</text><rect x="580" y="227" width="54" height="14" rx="4" fill="#cddcc0"/><text x="642" y="239" font-size="12" fill="#6f7569">9%</text>
<text x="470" y="269" font-size="13" fill="#6f7569" text-anchor="end">5</text><text x="484" y="269" font-size="15" font-weight="400" fill="#33372f">hotel</text><rect x="580" y="257" width="42" height="14" rx="4" fill="#cddcc0"/><text x="630" y="269" font-size="12" fill="#6f7569">7%</text>
<text x="470" y="299" font-size="13" fill="#6f7569" text-anchor="end">6</text><text x="484" y="299" font-size="15" font-weight="400" fill="#33372f">home</text><rect x="580" y="287" width="36" height="14" rx="4" fill="#cddcc0"/><text x="624" y="299" font-size="12" fill="#6f7569">6%</text>
<rect x="450" y="311" width="410" height="26" rx="8" fill="#fbefe7"/>
<text x="470" y="329" font-size="13" fill="#6f7569" text-anchor="end">7</text><text x="484" y="329" font-size="15" font-weight="700" fill="#33372f">house</text><rect x="580" y="317" width="30" height="14" rx="4" fill="#c0764f"/><text x="618" y="329" font-size="12" fill="#6f7569">5%</text>
<text x="470" y="359" font-size="13" fill="#6f7569" text-anchor="end">8</text><text x="484" y="359" font-size="15" font-weight="400" fill="#33372f">bed</text><rect x="580" y="347" width="18" height="14" rx="4" fill="#cddcc0"/><text x="606" y="359" font-size="12" fill="#6f7569">3%</text>
<text x="470" y="389" font-size="13" fill="#6f7569" text-anchor="end">9</text><text x="484" y="389" font-size="15" font-weight="400" fill="#33372f">office</text><rect x="580" y="377" width="12" height="14" rx="4" fill="#cddcc0"/><text x="600" y="389" font-size="12" fill="#6f7569">2%</text>
<text x="484" y="418" font-size="13" fill="#6f7569">… and thousands more, each less likely</text>
</svg>
