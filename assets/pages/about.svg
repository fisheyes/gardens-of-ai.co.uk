<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Helvetica Neue,sans-serif">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#f3efe4"/></linearGradient>
 <linearGradient id="out" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbefe7"/><stop offset="1" stop-color="#eef3e8"/></linearGradient>
