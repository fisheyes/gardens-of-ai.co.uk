# Scans every push and pull request for secrets (keys, tokens, passwords) with the free gitleaks CLI.
# A failed run means gitleaks found something: do not merge, remove it and rotate the secret.
name: secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:vv8.30.1 git /repo --redact --verbose
