<section class="hero">
  <div class="hero-text">
    <p class="eyebrow">{{tagline}}</p>
    <h1>Gardens of <span class="accent">AI</span></h1>
    <p>{{intro}}</p>
  </div>
  <div class="garden">
    <div class="tree" style="aspect-ratio:{{ratio}}">
{{tree}}
      <div class="blooms">
{{blooms}}
      </div>
    </div>
    <div class="allotment" style="aspect-ratio:{{bedRatio}};margin-bottom:{{lift}}%">
{{allotment}}
      <div class="plants">
{{plants}}
      </div>
    </div>
  </div>
  <p class="garden-key"><span><span class="key-bloom"></span>Projects on the tree</span> <span><span class="key-plant"></span>Technical notes in the allotment</span></p>
</section>
<section class="posts">
  <h2 class="section-title">Projects</h2>
{{projects}}
</section>
<section class="posts">
  <h2 class="section-title">Technical notes</h2>
{{notes}}
</section>
